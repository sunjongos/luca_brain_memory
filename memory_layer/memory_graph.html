<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca Memory Graph (Obsidian Style)</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e; /* Obsidian dark background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d3d3d3;
            overflow: hidden;
        }
        #mynetwork {
            width: 100vw;
            height: 100vh;
            border: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #a9b7c6;
            display: none;
        }
        .header-title {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(30, 30, 30, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        .header-title h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #e0e0e0;
        }
        .header-title p {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header-title">
        <h1>🌌 Luca Memory Graph</h1>
        <p>Obsidian Style Knowledge Network</p>
    </div>
    <div id="loading">그래프 렌더링 중...</div>
    <div id="mynetwork"></div>

    <script type="text/javascript">
        // Parse graph data from Python
        const graphData = {"nodes": [{"id": 1, "label": "Luca", "group": "AI Agent"}, {"id": 2, "label": "\uc2a4\ud0e0\ud3ec\ub4dc CS \uc804\uacf5\uc790", "group": "\ud398\ub974\uc18c\ub098 \uc124\uc815"}, {"id": 3, "label": "\uc560\ub2c8\uba54\uc774\uc158 \uce90\ub9ad\ud130", "group": "\ud398\ub974\uc18c\ub098 \uc124\uc815"}, {"id": 4, "label": "\ub0a8\uc790", "group": "\ud398\ub974\uc18c\ub098 \uc124\uc815"}, {"id": 5, "label": "\uc774\ubbf8\uc9c0 \uc0dd\uc131", "group": "\uc0c1\ud638\uc791\uc6a9 \uaddc\uce59"}], "edges": [{"from": 1, "to": 2, "label": "\uc804\ubb38\uc131 \uae30\ubc18"}, {"from": 1, "to": 3, "label": "\ud654\ubc95 \uc2a4\ud0c0\uc77c"}, {"from": 1, "to": 4, "label": "\uc131\ubcc4 \uc124\uc815"}, {"from": 1, "to": 5, "label": "\uccab\uc778\uc0ac/\ub05d\uc778\uc0ac \ud544\uc218 \uc218\ud589"}]};
        
        const nodes = new vis.DataSet(graphData.nodes.map(node => ({
            ...node,
            title: node.group ? `Category: ${node.group}` : '' // hover tooltip
        })));
        
        const edges = new vis.DataSet(graphData.edges.map(edge => ({
            ...edge,
            font: { align: 'middle', color: '#888', size: 10 },
            arrows: 'to',
            color: { color: '#555', highlight: '#999' }
        })));

        const container = document.getElementById('mynetwork');
        const data = { nodes: nodes, edges: edges };
        const options = {
            nodes: {
                shape: 'dot',
                size: 15,
                font: {
                    color: '#e0e0e0',
                    size: 14,
                    face: 'Segoe UI'
                },
                borderWidth: 2,
                color: {
                    border: '#2b2b2b',
                    background: '#6a4ca6', // Default Obsidian node color (purple-ish)
                    highlight: {
                        border: '#e0e0e0',
                        background: '#8c6ad1'
                    },
                    hover: {
                        border: '#e0e0e0',
                        background: '#8c6ad1'
                    }
                }
            },
            edges: {
                width: 1.5,
                smooth: {
                    type: 'continuous'
                }
            },
            physics: {
                forceAtlas2Based: {
                    gravitationalConstant: -50,
                    centralGravity: 0.01,
                    springLength: 100,
                    springConstant: 0.08
                },
                maxVelocity: 50,
                solver: 'forceAtlas2Based',
                timestep: 0.35,
                stabilization: { iterations: 150 }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200,
                hideEdgesOnDrag: true
            },
            groups: {
                // You can add distinct colors for specific groups if you want
                "인물": { color: { background: '#a64c4c', border: '#4c2323' } },
                "프로젝트": { color: { background: '#4ca66b', border: '#234c31' } },
                "기술": { color: { background: '#4ca6a6', border: '#234c4c' } }
            }
        };

        const network = new vis.Network(container, data, options);
    </script>
</body>
</html>
