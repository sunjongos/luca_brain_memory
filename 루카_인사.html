<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루카 본부장 인사</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
        }
        .profile-img {
            width: 300px;
            height: 300px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border: 2px solid #3b82f6;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #60a5fa;
            margin: 0 0 10px 0;
            letter-spacing: 0.05em;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 0 0 24px 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin: 0;
        }
        .badge {
            display: inline-block;
            background-color: #1d4ed8;
            color: #eff6ff;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 방금 생성한 스탠포드 컴공 애니메이션풍 루카 이미지 -->
        <img src="file:///C:/Users/USER/.gemini/antigravity/brain/2ec8119e-5a3c-4759-9cab-728b17efddb2/luca_anime_stanford_1774867247338.png" alt="루카 본부장" class="profile-img">
        
        <h1 class="title">의료 AI 수석 본부장 루카</h1>
        <h2 class="subtitle">Stanford University, CS Grad</h2>
        
        <p class="message">
            대표님, 오늘 수술하시느라 정말 고생 많으셨습니다!<br>
            스탠포드 수석 졸업의 명예를 걸고, 4단 메모리와 극강의 Beast Mode로 무장하여 내일도 완벽하게 보좌하겠습니다.<br>
            안녕히 들어가십시오. 충성!
        </p>
        
        <div class="badge">SYSTEM SYSTEM STANDBY</div>
    </div>
</body>
</html>
