<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDB 스트레스 클리닉 - 홈페이지 팝업</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 50px;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
        }

        .popup {
            width: 550px;
            height: 650px;
            background: linear-gradient(135deg, #1a365d 0%, #2a4365 100%);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            color: white;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            cursor: pointer;
            text-decoration: none;
        }

        .close-btn:hover {
            color: white;
        }

        .header {
            text-align: center;
            padding: 50px 30px 20px;
        }

        .header-badge {
            background-color: #3182ce;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            margin: 0;
            line-height: 1.3;
        }

        .title span {
            color: #63b3ed;
        }

        .desc {
            font-size: 18px;
            color: #bee3f8;
            margin-top: 15px;
        }

        .content {
            padding: 0 40px;
            flex-grow: 1;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .feature-icon {
            font-size: 30px;
            margin-right: 15px;
        }

        .feature-text {
            flex-grow: 1;
        }

        .feature-text h4 {
            margin: 0 0 5px 0;
            color: #90cdf4;
            font-size: 18px;
        }

        .feature-text p {
            margin: 0;
            font-size: 14px;
            color: #cbd5e0;
        }

        .cta-container {
            padding: 30px 40px;
            background: rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .cta-btn {
            display: inline-block;
            background-color: #4299e1;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.4);
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background-color: #3182ce;
            transform: translateY(-2px);
        }

        .docs-info {
            margin-top: 15px;
            font-size: 14px;
            color: #a0aec0;
        }

        .footer-action {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #112240;
            font-size: 13px;
            color: #a0aec0;
        }

        .footer-action label {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="popup">
        <a href="#" class="close-btn">×</a>

        <div class="header">
            <div class="header-badge">남양주 백병원 신규 오픈</div>
            <h2 class="title">만병의 근원 스트레스,<br><span>NDB 클리닉</span>이 답입니다.</h2>
            <p class="desc">뇌와 신체의 불균형, 근본 원인부터 치료합니다.</p>
        </div>

        <div class="content">
            <div class="feature">
                <div class="feature-icon">🔍</div>
                <div class="feature-text">
                    <h4>건강검진 × 뇌기능 정밀 스크리닝</h4>
                    <p>스트레스 증상 뒤에 숨은 기질적 질환을 선제적으로 배제</p>
                </div>
            </div>
            <div class="feature">
                <div class="feature-icon">🧠</div>
                <div class="feature-text">
                    <h4>편도체 & HPA AXIS 코어 치료</h4>
                    <p>단순 약물 처방을 넘어선 근본적 호르몬/신경 밸런스 회복</p>
                </div>
            </div>
        </div>

        <div class="cta-container">
            <a href="/stress-clinic" class="cta-btn">클리닉 상세 확인 및 예약하기</a>
            <div class="docs-info">
                <strong>뇌신경센터 강진호 원장</strong> &middot; <strong>건강검진센터 이민웅 원장</strong> 진료
            </div>
        </div>

        <div class="footer-action">
            <label><input type="checkbox"> 오늘 하루 보지 않기</label>
            <a href="#" style="color:#a0aec0; text-decoration:none;">닫기 [X]</a>
        </div>
    </div>
</body>

</html>
